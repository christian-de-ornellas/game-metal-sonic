<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd740"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Sonic ring -->
  <circle cx="256" cy="220" r="90" fill="none" stroke="url(#ring)" stroke-width="28"/>
  <circle cx="256" cy="220" r="90" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-dasharray="40 200" stroke-dashoffset="20"/>
  <!-- Letter P -->
  <text x="256" y="400" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="120" fill="#ffffff">P</text>
  <!-- Small stars -->
  <circle cx="100" cy="100" r="6" fill="#ffd740" opacity="0.8"/>
  <circle cx="400" cy="120" r="4" fill="#ffd740" opacity="0.6"/>
  <circle cx="130" cy="380" r="5" fill="#ffd740" opacity="0.7"/>
  <circle cx="410" cy="360" r="3" fill="#ffd740" opacity="0.5"/>
</svg>
